[project]
name = "prism-hotel-agent-sim"
version = "0.1.0"
description = "A Prism voice agent that phones hotels to cancel reservations, tested against simulated hotels."
requires-python = ">=3.12,<3.14"
dependencies = [
    "rimelabs-sdk==0.1.0a27",
    "numpy>=1.26",
    "anthropic>=1.0",
    "jiwer>=3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
